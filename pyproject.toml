[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tlq"
version = "0.1.0"
description = "The Last Question, Answered"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "python-dotenv>=1.0.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
